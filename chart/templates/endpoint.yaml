{{- $endpointSecretName := printf "%s-endpoint" (include "finops-database-handler.fullname" .) }}
{{- $endpointSecret := lookup "v1" "Secret" .Release.Namespace $endpointSecretName }}
{{- $sourceSecret := lookup "v1" "Secret" .Release.Namespace .Values.cratedbUserSystemName }}
{{- if and (not $endpointSecret) $sourceSecret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $endpointSecretName }}
stringData:
  server-url: http://{{ include "finops-database-handler.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
  username: system
  password: {{ $sourceSecret.data.password | b64dec | quote }}
---
{{- end }}
apiVersion: finops.krateo.io/v1
kind: DatabaseConfig
metadata:
  name: {{ include "finops-database-handler.fullname" . }}
spec:
  username: system
  passwordSecretRef:
    name: {{ .Values.cratedbUserSystemName }}
    namespace: {{ .Release.Namespace }}
    key: password
